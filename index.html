:root{color-scheme:light;--navy:#0a2240;--navy-2:#123a66;--bg:#f3f5f8;--panel:#fff;--line:#d9dee7;--line-soft:#eceff4;--ink:#101828;--ink-2:#475467;--muted:#667085;
--s1:#2a78d6;--s2:#eb6834;--bad:#c2410c;--bad-soft:#fff4ed;--ok:#0f766e;--ok-soft:#effaf8;
--sans:"Source Sans 3",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--serif:"Source Serif 4",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
a{color:var(--navy-2)}
.bar{background:var(--navy);color:#fff}
.bar .in{max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.01em;font-size:17px}
.brand .mark{width:30px;height:30px;border:2px solid #fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.brand small{font-weight:400;opacity:.75;font-size:13px;border-left:1px solid rgba(255,255,255,.3);padding-left:12px}
.nav{display:flex;gap:22px;font-size:14px}.nav a{color:#fff;text-decoration:none;opacity:.85}.nav a:hover{opacity:1;text-decoration:underline}
@media (max-width:760px){.nav{display:none}.brand small{display:none}}
.hero{background:var(--panel);border-bottom:1px solid var(--line)}
.hero .in{max-width:1440px;margin:0 auto;padding:40px clamp(20px,4vw,56px) 32px;display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:end}
@media (max-width:860px){.hero .in{grid-template-columns:1fr}}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-2)}
h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;margin:8px 0 10px;color:var(--navy)}
.lead{color:var(--ink-2);font-size:16.5px;margin:0;max-width:760px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--navy);background:#fff;color:var(--navy);padding:10px 18px;border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:#eef2f8}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy-2)}
.btn.link{border-color:transparent;background:none;padding:10px 4px;text-decoration:underline}
.wrap{max-width:1440px;margin:0 auto;padding:28px clamp(20px,4vw,56px) 44px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 24px;margin-bottom:18px}
.card h2{font-size:18px;font-weight:700;color:var(--navy);margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
.card h2 .n{font-size:13px;color:var(--muted);font-weight:600}
.card .note{font-size:13px;color:var(--muted);margin:0 0 14px}
.privacy{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);padding:12px 16px;font-size:14px;color:var(--ink-2);margin-bottom:18px}
.privacy svg{flex:none;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
@media (max-width:760px){.kpis{grid-template-columns:1fr}}
.kpi{padding:18px 20px;border-right:1px solid var(--line);border-top:4px solid var(--ok)}
.kpi:last-child{border-right:0}.kpi.bad{border-top-color:var(--bad)}
.kpi .l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--navy)}
.kpi .q{font-size:13.5px;color:var(--muted);margin:2px 0 10px;min-height:40px}
.kpi .v{font-size:38px;font-weight:700;letter-spacing:-.01em;color:var(--ink);line-height:1}
.kpi .d{font-size:13px;color:var(--ink-2);margin-top:6px}
.status{display:inline-block;font-size:12px;font-weight:700;margin-top:10px;letter-spacing:.03em}
.status.bad{color:var(--bad)}.status.good{color:var(--ok)}
.alert{border:1px solid #f5c9ad;border-left:4px solid var(--bad);background:var(--bad-soft);padding:12px 16px;margin:10px 0;font-size:14.5px}
.alert.ok{border-color:#b8e3dc;border-left-color:var(--ok);background:var(--ok-soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:700;background:#f7f9fb;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
svg text{font-family:var(--sans)}
.muted{color:var(--muted)}.small{font-size:13px}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line)}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}@media (max-width:560px){.steps{grid-template-columns:1fr}}
.steps li{padding:16px 18px;border-right:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.steps li:last-child{border-right:0}
.steps li b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}
.steps .k{font-family:var(--serif);font-size:26px;color:var(--navy-2);display:block;line-height:1;margin-bottom:8px}
.upload{display:none;gap:14px;grid-template-columns:1fr 1fr auto;align-items:end;margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft)}
.upload.show{display:grid}@media (max-width:860px){.upload.show{grid-template-columns:1fr}}
.upload label{font-size:13px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:6px}
.upload input{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line);padding:9px;background:#fafbfc}
.msg{font-size:13.5px;margin-top:10px}.msg.err{color:#b42318}
.source{font-size:13px;color:var(--ink-2);margin:0 0 14px}.source b{color:var(--navy)}
.res{display:flex;flex-wrap:wrap;gap:10px}
footer{background:var(--navy);color:#c8d3e3;font-size:13px}
footer .in{max-width:1440px;margin:0 auto;padding:22px clamp(20px,4vw,56px);display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer a{color:#fff}
@media print{body{background:#fff}.bar,.hero .actions,.privacy,.trust,.noprint,footer{display:none!important}.card{break-inside:avoid}}
.esp-sec .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}.esp-sec .tabs .btn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.kpi .v{font-family:var(--serif);font-size:28px;color:var(--navy);line-height:1.1}.kpi .kl{font-size:13px;color:var(--ink-2);text-transform:none;letter-spacing:0;font-weight:400}.kpi.alto .v{color:var(--bad)}
.esp-plot{width:100%;overflow-x:auto}.esp-plot svg{display:block;max-width:100%;height:auto}
.esp-tab{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}.esp-tab th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:6px 8px}
.esp-tab td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}.esp-tab tr:last-child td{border-bottom:2px solid var(--ink)}.esp-tab td.n{text-align:right;white-space:nowrap}
.esp-tab tr.grp td{font-weight:700;color:var(--navy);background:var(--bg)}.esp-lee{background:var(--bg);border-left:3px solid var(--navy);padding:8px 12px;margin:12px 0;font-size:14px}
</style>
<style>
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;white-space:nowrap}

<style>
.lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:2px;overflow:hidden;flex:none}

const DOCS = {"es": {"form": {"titulo": "Formulario de solicitud de cuenta de pago básica", "archivo": "formulario_solicitud_CPB.md", "md": "# Modelo de solicitud de cuenta de pago básica\n\n*Plantilla abierta propuesta como base para un formulario normalizado. Su finalidad es que toda solicitud, también la que termina sin apertura, quede registrada y pueda revisarse. No sustituye al modelo que, en su caso, apruebe el Banco de España.*\n\n---\n\n**Entidad:** ____________________ **Oficina / canal:** ☐ Oficina ☐ Web ☐ App ☐ Videollamada ☐ Teléfono\n**Fecha de la solicitud:** ___ / ___ / ______ **N.º de registro:** ____________ *(se entrega copia al solicitante)*\n\n### 1. Persona solicitante\nNombre y apellidos: ______________________________________\nTeléfono o correo de contacto: ______________________________\n\n### 2. Supuesto por el que solicita la cuenta (Real Decreto-ley 19/2017, art. 3)\n☐ Resido legalmente en la Unión Europea (aunque no tenga domicilio fijo)\n☐ Soy solicitante de asilo o de protección internacional\n☐ No tengo permiso de residencia, pero mi expulsión es imposible por razones jurídicas o de hecho\n\n### 3. Documento de identidad que presento\n☐ DNI ☐ NIE / TIE ☐ Pasaporte\n☐ Documento de solicitante o beneficiario de protección internacional\n☐ Resguardo oficial de solicitud de protección internacional o temporal\n☐ Documento de identidad del país de origen\n☐ Otro documento oficial: ______________________\n\n### 4. Declaración responsable\n☐ Declaro que no soy titular de otra cuenta de pago en una entidad de crédito establecida en España.\n☐ Solicito, además, el régimen gratuito por situación de vulnerabilidad (Real Decreto 164/2019). *(Se entrega el formulario específico.)*\n\n### 5. A cumplimentar por la entidad\n| | |\n|---|---|\n| Perfil de entrada (uno, el primero que se detecta) | ☐ Documento estándar ☐ Protección internacional ☐ NIE en trámite o resguardo ☐ Pasaporte de fuera de la UE sin chip ☐ Sin domicilio fijo o sin justificante ☐ Necesita asistencia en la verificación ☐ Sin historial crediticio ☐ Otro |\n| Resultado | ☐ Cuenta abierta ☐ Alternativa ofrecida y aceptada ☐ Pendiente de información ☐ Denegada |\n| Si no se abre, causa (una) | ☐ Documentación insuficiente ☐ Documento no reconocido ☐ Información adicional por prevención del blanqueo ☐ Alerta escalada ☐ Duplicidad ☐ Desistimiento ☐ Fallo técnico o de verificación ☐ Derivación a alternativa ☐ Rechazo definitivo |\n| ¿Se valoró una alternativa proporcional antes del rechazo? | ☐ Sí: ______________ ☐ No |\n| ¿Hubo revisión por una persona distinta de quien atendió? | ☐ Sí ☐ No |\n| Plazo de respuesta comunicado al solicitante | ______ días |\n\n### 6. Información para la persona solicitante\n- La entidad debe responder a su solicitud y, si la deniega, **comunicárselo por escrito, de forma gratuita y con el motivo concreto**, salvo en los casos que la ley exceptúa (RDL 19/2017, art. 5).\n- Si no está de acuerdo, puede reclamar al Servicio de Atención al Cliente de la entidad y, después, al Servicio de Reclamaciones del Banco de España.\n- Conserve su copia con el número de registro.\n\nFirma de la persona solicitante: ____________ Firma y sello de la entidad: ____________\n", "html": "<h1>Modelo de solicitud de cuenta de pago básica<\/h1>\n<p><em>Plantilla abierta propuesta como base para un formulario normalizado. Su finalidad es que toda solicitud, también la que termina sin apertura, quede registrada y pueda revisarse. No sustituye al modelo que, en su caso, apruebe el Banco de España.<\/em><\/p>\n<hr />\n<p><strong>Entidad:<\/strong> ____________________ <strong>Oficina / canal:<\/strong> ☐ Oficina ☐ Web ☐ App ☐ Videollamada ☐ Teléfono<br />\n<strong>Fecha de la solicitud:<\/strong> ___ / ___ / ______ <strong>N.º de registro:<\/strong> ____________ <em>(se entrega copia al solicitante)<\/em><\/p>\n<h3>1. Persona solicitante<\/h3>\n<p>Nombre y apellidos: ______________________________________<br />\nTeléfono o correo de contacto: ______________________________<\/p>\n<h3>2. Supuesto por el que solicita la cuenta (Real Decreto-ley 19/2017, art. 3)<\/h3>\n<p>☐ Resido legalmente en la Unión Europea (aunque no tenga domicilio fijo)<br />\n☐ Soy solicitante de asilo o de protección internacional<br />\n☐ No tengo permiso de residencia, pero mi expulsión es imposible por razones jurídicas o de hecho<\/p>\n<h3>3. Documento de identidad que presento<\/h3>\n<p>☐ DNI ☐ NIE / TIE ☐ Pasaporte<br />\n☐ Documento de solicitante o beneficiario de protección internacional<br />\n☐ Resguardo oficial de solicitud de protección internacional o temporal<br />\n☐ Documento de identidad del país de origen<br />\n☐ Otro documento oficial: ______________________<\/p>\n<h3>4. Declaración responsable<\/h3>\n<p>☐ Declaro que no soy titular de otra cuenta de pago en una entidad de crédito establecida en España.<br />\n☐ Solicito, además, el régimen gratuito por situación de vulnerabilidad (Real Decreto 164/2019). <em>(Se entrega el formulario específico.)<\/em><\/p>\n<h3>5. A cumplimentar por la entidad<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Perfil de entrada (uno, el primero que se detecta)<\/td>\n<td>☐ Documento estándar ☐ Protección internacional ☐ NIE en trámite o resguardo ☐ Pasaporte de fuera de la UE sin chip ☐ Sin domicilio fijo o sin justificante ☐ Necesita asistencia en la verificación ☐ Sin historial crediticio ☐ Otro<\/td>\n<\/tr>\n<tr>\n<td>Resultado<\/td>\n<td>☐ Cuenta abierta ☐ Alternativa ofrecida y aceptada ☐ Pendiente de información ☐ Denegada<\/td>\n<\/tr>\n<tr>\n<td>Si no se abre, causa (una)<\/td>\n<td>☐ Documentación insuficiente ☐ Documento no reconocido ☐ Información adicional por prevención del blanqueo ☐ Alerta escalada ☐ Duplicidad ☐ Desistimiento ☐ Fallo técnico o de verificación ☐ Derivación a alternativa ☐ Rechazo definitivo<\/td>\n<\/tr>\n<tr>\n<td>¿Se valoró una alternativa proporcional antes del rechazo?<\/td>\n<td>☐ Sí: ______________ ☐ No<\/td>\n<\/tr>\n<tr>\n<td>¿Hubo revisión por una persona distinta de quien atendió?<\/td>\n<td>☐ Sí ☐ No<\/td>\n<\/tr>\n<tr>\n<td>Plazo de respuesta comunicado al solicitante<\/td>\n<td>______ días<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>6. Información para la persona solicitante<\/h3>\n<ul>\n<li>La entidad debe responder a su solicitud y, si la deniega, <strong>comunicárselo por escrito, de forma gratuita y con el motivo concreto<\/strong>, salvo en los casos que la ley exceptúa (RDL 19/2017, art. 5).<\/li>\n<li>Si no está de acuerdo, puede reclamar al Servicio de Atención al Cliente de la entidad y, después, al Servicio de Reclamaciones del Banco de España.<\/li>\n<li>Conserve su copia con el número de registro.<\/li>\n<\/ul>\n<p>Firma de la persona solicitante: ____________ Firma y sello de la entidad: ____________<\/p>"}, "check": {"titulo": "Lista de comprobación del alta por perfil", "archivo": "checklist_alta_digital.md", "md": "# Lista de comprobación: un alta que reconoce a todos los perfiles de entrada\n\n*Para equipos de producto, cumplimiento y experiencia de cliente. Cada «No» es un punto en el que el alta puede dejar fuera a personas con derecho a la cuenta antes de que exista cualquier modelo. Conviene documentarlo en la DPIA (RGPD art. 35) o en la FRIA (Reglamento de IA art. 27).*\n\n## A. Reconocimiento de cada perfil de entrada\n| Perfil | Comprobación |\n|---|---|\n| Documento de protección internacional | [ ] El selector de documentos del alta digital lo incluye y la lectura automática se ha probado con él. |\n| NIE en trámite o resguardo | [ ] El proceso admite documentos provisionales y define qué verificación adicional aplica. |\n| Pasaporte de fuera de la UE sin chip | [ ] Si falla la lectura NFC, existe una verificación alternativa (lectura óptica, videollamada, oficina). |\n| Sin domicilio fijo o sin justificante | [ ] Se admiten alternativas al justificante (declaración responsable, certificado de un servicio social o de un albergue). |\n| Móvil o conexión insuficientes para la verificación | [ ] Si falla el selfie, el NFC, el vídeo o el SMS, se ofrece otra vía (videollamada, código por otro medio, cita presencial), no un error genérico. |\n| Necesita ayuda para completar el proceso digital | [ ] Hay asistencia humana (teléfono, chat u oficina) y el formulario usa lenguaje claro. |\n| Necesita un ajuste de accesibilidad | [ ] El canal funciona con lector de pantalla y no depende sólo de instrucciones visuales o sonoras; se registra el ajuste requerido y si estaba disponible, nunca un diagnóstico (Directiva (UE) 2019/882). |\n| Sin historial crediticio | [ ] Se conoce cuántas personas con cuenta no llegan a ser evaluables y se valora el uso de datos alternativos lícitos. |\n\n- [ ] La lista de documentos admitidos está publicada y es coherente entre web, app y oficina.\n- [ ] Cuando el canal digital no puede verificar una credencial válida, la pantalla lo explica y ofrece una ruta alternativa concreta.\n\n## B. Registro del no acceso\n- [ ] Cada intento de alta interrumpido genera un registro con su perfil de entrada y una de las nueve causas normalizadas (esquema `registro_no_acceso`).\n- [ ] Existe un formulario de solicitud de cuenta básica en web y oficina, con número de registro y copia para el solicitante.\n- [ ] Las negativas se comunican por escrito y con motivo concreto (RDL 19/2017, art. 5) y se mide el porcentaje que cumple.\n\n## C. Proporcionalidad antes del rechazo\n- [ ] Antes de rechazar por riesgo de blanqueo se valora y registra una alternativa (límites de operativa, verificación adicional, seguimiento reforzado) (EBA/GL/2023/04).\n- [ ] La alternativa no sustituye el derecho a la cuenta de pago básica cuando se cumplen sus requisitos.\n\n## D. Revisión humana y reversión\n- [ ] Los rechazos automáticos del alta pueden escalarse a una persona con capacidad de decidir.\n- [ ] Se mide la tasa de reversión tras revisión por perfil de entrada; una tasa alta indica falsos negativos del proceso.\n\n## E. Conexión con la gobernanza de IA\n- [ ] El informe de evaluabilidad (`python -m evaluabilidad` o la versión web) se ejecuta al menos semestralmente.\n- [ ] Sus resultados se anexan a la FRIA de los sistemas de solvencia y a la vigilancia poscomercialización (Reglamento de IA arts. 27 y 72).\n- [ ] Los perfiles con «Señal clara» activan una revisión documentada del paso del alta donde se pierden.\n", "html": "<h1>Lista de comprobación: un alta que reconoce a todos los perfiles de entrada<\/h1>\n<p><em>Para equipos de producto, cumplimiento y experiencia de cliente. Cada «No» es un punto en el que el alta puede dejar fuera a personas con derecho a la cuenta antes de que exista cualquier modelo. Conviene documentarlo en la DPIA (RGPD art. 35) o en la FRIA (Reglamento de IA art. 27).<\/em><\/p>\n<h2>A. Reconocimiento de cada perfil de entrada<\/h2>\n<table>\n<thead>\n<tr>\n<th>Perfil<\/th>\n<th>Comprobación<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Documento de protección internacional<\/td>\n<td>☐ El selector de documentos del alta digital lo incluye y la lectura automática se ha probado con él.<\/td>\n<\/tr>\n<tr>\n<td>NIE en trámite o resguardo<\/td>\n<td>☐ El proceso admite documentos provisionales y define qué verificación adicional aplica.<\/td>\n<\/tr>\n<tr>\n<td>Pasaporte de fuera de la UE sin chip<\/td>\n<td>☐ Si falla la lectura NFC, existe una verificación alternativa (lectura óptica, videollamada, oficina).<\/td>\n<\/tr>\n<tr>\n<td>Sin domicilio fijo o sin justificante<\/td>\n<td>☐ Se admiten alternativas al justificante (declaración responsable, certificado de un servicio social o de un albergue).<\/td>\n<\/tr>\n<tr>\n<td>Móvil o conexión insuficientes para la verificación<\/td>\n<td>☐ Si falla el selfie, el NFC, el vídeo o el SMS, se ofrece otra vía (videollamada, código por otro medio, cita presencial), no un error genérico.<\/td>\n<\/tr>\n<tr>\n<td>Necesita ayuda para completar el proceso digital<\/td>\n<td>☐ Hay asistencia humana (teléfono, chat u oficina) y el formulario usa lenguaje claro.<\/td>\n<\/tr>\n<tr>\n<td>Necesita un ajuste de accesibilidad<\/td>\n<td>☐ El canal funciona con lector de pantalla y no depende sólo de instrucciones visuales o sonoras; se registra el ajuste requerido y si estaba disponible, nunca un diagnóstico (Directiva (UE) 2019/882).<\/td>\n<\/tr>\n<tr>\n<td>Sin historial crediticio<\/td>\n<td>☐ Se conoce cuántas personas con cuenta no llegan a ser evaluables y se valora el uso de datos alternativos lícitos.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>☐ La lista de documentos admitidos está publicada y es coherente entre web, app y oficina.<\/li>\n<li>☐ Cuando el canal digital no puede verificar una credencial válida, la pantalla lo explica y ofrece una ruta alternativa concreta.<\/li>\n<\/ul>\n<h2>B. Registro del no acceso<\/h2>\n<ul>\n<li>☐ Cada intento de alta interrumpido genera un registro con su perfil de entrada y una de las nueve causas normalizadas (esquema <code>registro_no_acceso<\/code>).<\/li>\n<li>☐ Existe un formulario de solicitud de cuenta básica en web y oficina, con número de registro y copia para el solicitante.<\/li>\n<li>☐ Las negativas se comunican por escrito y con motivo concreto (RDL 19/2017, art. 5) y se mide el porcentaje que cumple.<\/li>\n<\/ul>\n<h2>C. Proporcionalidad antes del rechazo<\/h2>\n<ul>\n<li>☐ Antes de rechazar por riesgo de blanqueo se valora y registra una alternativa (límites de operativa, verificación adicional, seguimiento reforzado) (EBA/GL/2023/04).<\/li>\n<li>☐ La alternativa no sustituye el derecho a la cuenta de pago básica cuando se cumplen sus requisitos.<\/li>\n<\/ul>\n<h2>D. Revisión humana y reversión<\/h2>\n<ul>\n<li>☐ Los rechazos automáticos del alta pueden escalarse a una persona con capacidad de decidir.<\/li>\n<li>☐ Se mide la tasa de reversión tras revisión por perfil de entrada; una tasa alta indica falsos negativos del proceso.<\/li>\n<\/ul>\n<h2>E. Conexión con la gobernanza de IA<\/h2>\n<ul>\n<li>☐ El informe de evaluabilidad (<code>python -m evaluabilidad<\/code> o la versión web) se ejecuta al menos semestralmente.<\/li>\n<li>☐ Sus resultados se anexan a la FRIA de los sistemas de solvencia y a la vigilancia poscomercialización (Reglamento de IA arts. 27 y 72).<\/li>\n<li>☐ Los perfiles con «Señal clara» activan una revisión documentada del paso del alta donde se pierden.<\/li>\n<\/ul>"}}, "en": {"check": {"titulo": "Onboarding checklist by entry profile", "archivo": "checklist_alta_digital_en.md", "md": "# Checklist: an onboarding process that recognises every entry profile\n\n*For product, compliance and customer-experience teams. Each \"No\" is a point where onboarding may leave out people entitled to an account before any model exists. It should be documented in the DPIA (GDPR Art. 35) or the FRIA (AI Act Art. 27).*\n\n## A. Recognition of each entry profile\n| Profile | Check |\n|---|---|\n| International protection document | [ ] The document selector in digital onboarding includes it and automatic reading has been tested with it. |\n| Pending residence number or official receipt | [ ] The process accepts provisional documents and defines which additional verification applies. |\n| Non-EU passport without a chip | [ ] If NFC reading fails, an alternative verification exists (optical reading, video call, branch). |\n| No fixed address or no proof of address | [ ] Alternatives to proof of address are accepted (self-declaration, certificate from a social service or shelter). |\n| Phone or connection not good enough for verification | [ ] If the selfie, NFC, video or SMS step fails, another route is offered (video call, code by other means, branch appointment), not a generic error. |\n| Needs help to complete the digital process | [ ] Human help is available (phone, chat or branch) and the form uses plain language. |\n| Needs an accessibility adjustment | [ ] The channel works with a screen reader and does not rely only on visual or audio instructions; the adjustment required and whether it was available are logged, never a diagnosis (Directive (EU) 2019/882). |\n| No credit history | [ ] The entity knows how many account holders never become scorable and assesses the use of lawful alternative data. |\n\n- [ ] The list of accepted documents is published and consistent across web, app and branch.\n- [ ] When the digital channel cannot verify a valid credential, the screen explains why and offers a concrete alternative route.\n\n## B. Recording non-entry\n- [ ] Every interrupted onboarding attempt generates a record with its entry profile and one of the nine standardised causes (`registro_no_acceso` schema).\n- [ ] A basic payment account application form is available online and in branches, with a reference number and a copy for the applicant.\n- [ ] Refusals are communicated in writing with a specific reason (Spain: RDL 19/2017, Art. 5; EU: Directive 2014/92/EU, Art. 16(7)) and the share that complies is measured.\n\n## C. Proportionality before refusal\n- [ ] Before refusing on money-laundering risk grounds, an alternative is assessed and recorded (transaction limits, additional verification, enhanced monitoring) (EBA/GL/2023/04).\n- [ ] The alternative does not replace the right to a basic payment account when its requirements are met.\n\n## D. Human review and reversal\n- [ ] Automatic onboarding refusals can be escalated to a person with decision-making authority.\n- [ ] The reversal rate after review is measured by entry profile; a high rate signals false negatives in the process.\n\n## E. Link to AI governance\n- [ ] The evaluability report (`python -m evaluabilidad` or the web version) is run at least every six months.\n- [ ] Its results are annexed to the FRIA of creditworthiness systems and to post-market monitoring (AI Act Arts. 27 and 72).\n- [ ] Profiles with a \"Clear signal\" trigger a documented review of the onboarding step where they are lost.\n", "html": "<h1>Checklist: an onboarding process   val_h:"Validación", val:"Por simulación, el IC 95 % cubre el valor real en el 94-95 % de los casos y las falsas alarmas son del 0,35 % con 300 intentos (1,5 % con 100). En escenarios con verdad conocida, detecta el 99-100 % de las pérdidas previas al modelo y localiza la etapa correcta en al menos el 94 %; una auditoría de equidad del modelo, que por construcción sólo ve a los evaluados, no las detecta. Ambos controles son complementarios (ensayo, tabla 12 y tabla C.3 del anexo C).",
  priv_h:"Privacidad",
  cite_h:"Cómo citar", cite_txt:"Sánchez Villa, M. F. (2026). <i>Evaluabilidad: medir el no acceso antes del modelo de crédito</i> (versión 0.4, prueba de concepto) [software]. Licencia Apache 2.0.",
  cite_n:"Prueba de concepto validada con datos sintéticos de verdad conocida y aplicada a microdatos públicos de encuesta y a tablas oficiales españolas; pendiente de validación con registros de una entidad. Mide asociaciones agregadas, no causas ni discriminación. Código abierto (Apache 2.0).",
  sub:"Auditoría abierta del acceso antes del modelo de crédito",
  nav_perf:"Perfiles", nav_como:"Cómo funciona", nav_plant:"Plantillas", nav_cod:"Código (GitHub)",
  eyebrow:"AI &amp; Data Governance · Banking", h1:"Antes de auditar el modelo,<br><b>audite quién llega a él</b>",
  lead:"Las pruebas de equidad miden cómo trata el modelo a quienes evalúa. Esta herramienta mide a quienes se quedaron antes: por su documento, su domicilio o por cómo se verifica su identidad. Y le indica en qué etapa aparece la primera diferencia: en el alta, al llegar al modelo o en la decisión.",
  compat_k:"Ámbito de aplicación", compat_1:"Reglas de software", compat_2:"Scorecards", compat_3:"Decisión humana", compat_4:"Inteligencia artificial", compat_h:"Cualquier sistema de decisión (reglas de software, scorecards, decisión humana o inteligencia artificial): analiza resultados, no el funcionamiento interno. Puede aplicarse a registros históricos siempre que existan registros comparables de cada etapa (intento, cuenta, evaluación y decisión) enlazados por un identificador.",
  oss_t:"Código abierto · Apache 2.0", oss_p:"Puede consultar el código para replicarlo o adaptarlo a las necesidades de su institución.", oss_b:"Ver el código en GitHub →",
  b_demo:"Calcular con datos de ejemplo", b_load:"Calcular con mis datos", b_print:"Exportar informe (PDF)", b_run:"Calcular",
  privacy:"Los datos no salen de su navegador. Los cálculos se hacen en su equipo: la página no envía ni guarda los archivos y no carga recursos de terceros (ni fuentes, ni analítica, ni cookies). Puede descargarla y usarla sin conexión. El registro no debe contener nombres, números de documento, nacionalidad ni edad.",
  perf_h:"Perfiles de entrada",
  perf_note:"Situaciones en las que un proceso de alta puede no reconocer bien a una persona. Cada intento de alta se registra con un perfil (el primero que el proceso detecta) y cada perfil se compara con el de referencia. Un perfil describe la credencial o la situación, no a la persona.",
  perf_c1:"Perfil de entrada", perf_c2:"Por qué el alta puede fallar", perf_c3:"Ejemplo",
  como_h:"Datos y parámetros",
  band_t:"Lo que el modelo <b>no ve</b>", band_l:"Tres datos del ensayo que dan origen a esta herramienta.",
  s1v:"0,45", s1t:"Acceso a una cuenta de quienes no tienen documento de identidad frente a quienes lo tienen, en 123 economías.", s1s:"Global Findex 2025 (Banco Mundial) · cálculo propio",
  s2v:"&lt; 1 %", s2t:"Pérdidas previas al modelo visibles para una auditoría de equidad del modelo, que por construcción sólo ve a los evaluados. Esta herramienta las detecta en el 99-100 % de los escenarios.", s2s:"Simulación con verdad conocida",
  s3v:"0 de 11", s3t:"Entidades en España que mencionan el documento de solicitante de protección internacional entre los admitidos para abrir una cuenta por internet, de las 11 que publican esos requisitos. En oficina, 5 de 15 publican que lo admiten.", s3s:"Revisión documental propia de 15 entidades · información pública, septiembre de 2026",
  ilu:"Ilustración: mano sosteniendo una tarjeta genérica de ejemplo", ilu_card:"TARJETA DE EJEMPLO",
  como_note:"Funciona con los datos que la entidad ya tiene y mejora a medida que registra más. Hoy, cuando alguien intenta abrir una cuenta y no lo logra, casi nunca queda registro: no hay solicitud, ni negativa escrita, ni causa. Registrar, clasificar, explicar y revisar esos casos es lo que el ensayo llama <b>gobernanza del no acceso</b>.",
  st1:"<b>Registrar cada intento de alta</b>Canal, perfil de entrada y resultado. Si no hubo cuenta, una de 9 causas normalizadas (modo completo).",
  st2:"<b>Añadir las decisiones de crédito</b>Opcional: identificador del intento y si se aprobó. Sin ellas, se analiza sólo el acceso a la cuenta (modo básico).",
  st3:"<b>Cargar los archivos</b>El informe compara cada perfil con el de referencia en cada etapa (alta, llegada al modelo y decisión), medida sobre quienes superaron la anterior, y señala la primera etapa con señal.",
  st4:"<b>Anexar el informe</b>A la DPIA (RGPD art. 35), la FRIA (Reglamento de IA art. 27) o la supervisión del art. 26.5 (y, a través del proveedor, la vigilancia del art. 72).",
  up_altas:"Intentos de alta (CSV, obligatorio)", up_cred:"Decisiones de crédito (CSV, opcional)", up_rep:"Representación frente a la población (CSV agregado, opcional: grupo, intentos_grupo, intentos_total, poblacion_pct)",
  blq_c:"C · Quién ni siquiera lo intenta: representación frente a la población", blq_c_note:"El registro sólo ve a quien empieza el alta. Para acercarse a quien no lo intenta —la persona mayor que no se anima con la app, quien vive lejos de una oficina— se compara quién intenta abrir una cuenta con quién vive en el área que atiende la entidad.",
  rep_h:"Representación de cada grupo entre quienes intentan abrir una cuenta", rep_note:"Representación = proporción del grupo en los intentos / proporción del grupo en la población adulta del área de servicio (padrón del INE u otra fuente oficial). 1 indica que el grupo lo intenta en la misma proporción en que está en la población; por debajo de 0,80, la herramienta lo señala con la misma regla que el resto del informe.",
  rep_none:"No hay datos de representación para esta fuente. Para calcularla, suba un CSV agregado con grupo, intentos_grupo, intentos_total y poblacion_pct.",
  rep_lim:"Es una señal, no una prueba: que un grupo lo intente menos puede deberse a menor demanda del producto y no a que el canal lo disuada. Si sólo se conoce la composición de las altas, el cociente mezcla el no intento y el no acceso. Los datos por grupo se usan sólo en agregado y con base jurídica propia. En el ejemplo, las cifras son ilustrativas.",
  rep_th:["Grupo","En la población","En los intentos","Representación [IC 95 %]","Señal"], rep_de:n=>`${n} de cada 100 esperados`,
  umbral_l:"Umbral de revisión del cociente", nmin_l:"Casos mínimos para «señal clara»",
  umbral_n:"Por defecto 0,80 (la referencia convencional de «cuatro quintos»). Es una regla práctica de revisión, no un criterio jurídico: ajústela a su política de riesgos.",
  r1:"Conclusiones", r2:"En qué etapa aparece la diferencia",
  r2_note:"Cada etapa se mide sobre quienes superaron la anterior, para no arrastrar pérdidas previas. Cociente = tasa del perfil / tasa del perfil de referencia (1 = igualdad). La barra muestra el intervalo de confianza del 95 %; la línea discontinua, el umbral de revisión.",
  r3:"Acceso por canal", r3_note:"% de intentos que terminan con cuenta. Cuanto más oscuro, mayor acceso.",
  r4:"Embudo por perfil", r4_note:"Las tres primeras columnas, % de quienes intentaron el alta; las dos últimas, % de quienes superaron la etapa anterior.",
  r5:"Trazabilidad y proporcionalidad", r5_note:"Recuperación tras fallo: de los intentos que no terminaron en un alta ordinaria, % que obtuvo cuenta por una vía alternativa; que la tecnología falle es inevitable, la señal es que no haya una vía para recuperar a la persona. Negativas escritas: RDL 19/2017, art. 5. Alternativa antes del rechazo: EBA/GL/2023/04. Una reversión alta tras revisión humana indica falsos negativos del proceso.",
  r6:"Causas de no acceso", r6_note:"% de los casos sin acceso de cada perfil.",
  r7:"Dónde incorporar cada resultado",

  limites:"Límites: mide asociaciones agregadas, no causalidad ni discriminación. Indica en qué etapa se observa una diferencia, no por qué se produce, y requiere registros comparables de cada etapa enlazados por un identificador. Un cociente bajo es una señal de revisión que requiere análisis individualizado. Úsela antes de las pruebas de equidad del modelo (por ejemplo, las de comparadores contrafactuales), no en su lugar.",

  wb_cite_h:"Fuente de los datos", wb_cite_n:"Para qué sirve: muestra el tamaño del problema en el mundo y comprueba que la herramienta detecta una diferencia conocida con datos reales. No mide el no acceso de ningún banco: una encuesta pregunta si la persona tiene cuenta, no si lo intentó ni qué le pasó. Datos de uso público del Banco Mundial. El archivo que usa esta página no contiene microdatos: se reconstruye con el número de personas encuestadas y la proporción ponderada con cuenta publicada en el repositorio (data/encuestas/findex2025_condiciones.csv). Con datos de encuesta sólo puede medirse la primera etapa, la tenencia de cuenta; las etapas de evaluación y decisión requieren registros de una entidad.", wb_fuente:"Cite los datos originales así:",

en:{
  title:"Evaluability · stage-wise access ratio calculator (proof of concept)", marca:"Evaluability",
  pc_tag:"Evaluability v0.4 · Proof of concept · Replication material · Open source (Apache 2.0)",
  sci_t:"At which step is each person lost? Measuring non-entry before the credit model, whether software, a person or an AI decides",
  sci_s:"A method to measure, before the credit model, whether each entry profile reaches the account, the scoring and the decision on equal terms, and at which stage the first gap appears. It analyses outcomes, not the system’s internals: it works whether the decision is made by a software rule, a person at the branch or an AI model.",
  sci_a:"M. F. Sánchez Villa (2026). Replication material for the essay <i>Gobernar antes del algoritmo</i> (Governing before the algorithm). Calculations run in your browser.",
  blq_b_note:"<b>Evaluability</b> is the possibility of being scored at all. Creditworthiness assessment systems are high-risk (AI Act, Annex III, point 5(b)) and deployers must ensure input data are relevant and sufficiently representative (Arts. 10 and 26(4)). This part shows whether the population reaching the model has already been filtered.",
  mas_concl:n=>`Show the other ${n} profiles with a signal`,
  ciego:n=>`In ${n} of these profiles approval among those scored is similar to the reference: a credit-model audit would not see the difference.`,
  clave_esc:(a,b)=>`<b>Written refusals:</b> only ${a} for non-standard profiles, against ${b} for the reference profile. For basic payment accounts, refusals must be given in writing, free of charge and with reasons, unless national security, public policy or anti-money-laundering rules prevent it (Directive 2014/92/EU, Art. 16(7)). In Spain that duty arises with a complete application (Royal Decree-law 19/2017, Art. 5): whoever is discouraged or gives up earlier receives nothing in writing, and only a log of every attempt makes them visible.`,
  gna_4:"<b>Where does the data come from?</b> From the institution’s onboarding log: channel, entry profile — the condition the process detects, such as an unrecognised document, a failed verification or a request for help — outcome and reason. Nationality, age and diagnoses are not recorded, and results are shared only in aggregate (legal basis and minimisation: GDPR Arts. 6, 9 and 25; essay §7.5). The report is an internal improvement tool: it is shared with the supervisor only in aggregate and with at least 100 attempts per profile.",
  cite_h_ens:"The essay", cite_ens:"Sánchez Villa, M. F. (2026). <i>Gobernar antes del algoritmo: IA, Data Governance y prevención de la exclusión financiera ante el nuevo marco regulatorio de la Unión Europea. De la trazabilidad del no acceso a la evaluabilidad algorítmica</i> [Governing before the algorithm]. Essay submitted to the 5th Federico Prades-IEBF Prize.", cite_h_sw:"The tool (software)", cite_intro:"References in APA style. Use “Copy citation” to paste them into your document.", ct_sw:"Software", ct_ds:"Dataset", cs_sw:"Evaluability · this tool", cs_wb:"World Bank · Global Findex 2025", cs_bde:"Banco de España · Financial Competences 2021", cs_est:"Eurostat · Internet banking 2024", b_copy:"Copy citation", cite_h_dat:"Dataset · World Bank", cite_h_bde:"Dataset · Banco de España", cite_h_est:"Dataset · Eurostat", disp:"Available at:",
  wm_nav:"Real data", wm_h:"Test with real data: Global Findex 2025 (World Bank)",
  wm_note:"The same logic, applied to the World Bank’s global financial inclusion survey. A survey does not log attempts, only whether a person has an account; so it measures the size of the problem, not any bank’s non-entry. Share of adults with an account at a financial institution, with and without each condition.",
  wm_cond:{sin_documento:"No identity document",sin_telefono:"No mobile phone",sin_internet:"Does not use the internet",telefono_basico:"Basic phone only (no smartphone)"},
  wm_eco:n=>`${n} economies`, wm_aj:x=>`${x} per 100 adjusted¹`,
  wm_leg_c:"With the condition", wm_leg_r:"Reference (has a document, smartphone or internet)",
  wm_ayuda:" of adults without an account say they could not use one without help (58 economies). The barrier is not only documentary: it is also technological and about skills.",
  wm_b:"Calculate with this data", wm_lim:"¹ Adjusted for age, sex, education, income, employment, rurality and country. Associations, not causal effects. In Spain the survey has 1,000 interviews and only 31 people without a document: it does not support conclusions for Spain; that requires institutions’ records.",
  es_nav:"Spain", es_h:"Context in Spain: barriers that also affect people with a national ID", es_note:"Two official context figures, not an evaluation with the tool: they are aggregates, without the sample sizes needed for confidence intervals, and they measure internet banking use and in-person access rather than onboarding attempts. They show who may be left out by onboarding that only works through an app or only at a branch.",
  es_dis_t:"Internet banking by disability (2024)", es_dis_r:"77.8% with no activity limitation", es_dis_p:"51.8% with a severe limitation", es_dis_v:"67 per 100 · aged 55 to 74: 44.3% vs 67.3%",
  es_geo_t:"Municipalities without in-person access to banking services (end of 2024)", es_geo_1:"municipalities, 32.4% of the total", es_geo_2:"people live in them",
  h_k:"When someone fails to open an account, there is rarely any record. And what is not recorded cannot be fixed.",
  h_de:"of 100", h_ref:"people with a national ID and no issues get the account.", h_per:"with a valid document the app does not recognise (in the example, an asylum-seeker document) get the account.",
  h_gap:"are left out. They get no formal refusal, build no history, and the credit model will never see them. This tool counts them.",
  h_ilus:"Illustrative figures from the example; with an institution’s records, the tool calculates its own.",
  gna_h:"What non-entry governance means",
  gna_1:"It means mapping the exclusion that never even gets recorded. For example:",

// ---------- datos de ejemplo: mismo algoritmo (mulberry32) y parámetros que demo/generar_datos_demo.py
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function elegir(u, pares){let s=0; for(const [k,p] of pares){s+=p; if(u<s) return k;} return pares[pares.length-1][0];}
function generarDemo(){
  const a=bloqueDemo(PARAM,40000,2026,0), b=bloqueDemo(PARAM_EXTRA,6000,2027,40000);   // igual que generar() en Python
  return {altas:a.altas.concat(b.altas), cred:a.cred.concat(b.cred)};
}
function bloqueDemo(PARAM, n, semilla, inicio){
  const rnd=mulberry32(semilla), pesos=Object.entries(PARAM).map(([k,v])=>[k,v[0]]), altas=[], cred=[];
  for(let i=inicio;i<inicio+n;i++){
    const u=Array.from({length:13},()=>rnd()), perfil=elegir(u[0],pesos);
    const [,pDig,accD,accO,cauD,cauO,pAlt,pRev,pEsc,pEv,pAp]=PARAM[perfil];
    const digital=u[1]<pDig, canal=digital?(u[2]<.5?"app":"web"):"oficina", ok=u[3]<(digital?accD:accO);
    let causa=null, alt=false, rev=false, revert=false, escrita=null, resultado, dias;
    if(ok){resultado="alta_completada"; dias=Math.floor(u[10]*3);}
    else{causa=elegir(u[4],digital?cauD:cauO); alt=u[5]<pAlt; resultado=(alt&&u[6]<.5)?"alternativa_aceptada":"no_acceso";
      if(resultado==="alternativa_aceptada") causa=null; rev=u[7]<.30; revert=rev&&u[8]<pRev;
      escrita=resultado==="no_acceso"?u[9]<pEsc:null; dias=Math.floor(u[10]*20);}
    const id="I"+String(i).padStart(6,"0");
    altas.push({id_intento:id,fecha:"2026-03-01",canal,producto:"cuenta_ordinaria",perfil_entrada:perfil,resultado,causa_no_acceso:causa,
      alternativa_ofrecida:alt,revision_humana:rev,revertida_tras_revision:revert,negativa_escrita:escrita,dias_resolucion:dias});
    if(resultado!=="no_acceso" && u[11]<pEv) cred.push({id_intento:id,aprobado:u[12]<pAp});
  }
  return {altas,cred};
}

// ---------- estadística (equivalente a evaluabilidad/metricas.py); resultados sin texto, el idioma se aplica al representar
function cocienteIC(x1,n1,x0,n0){
  if(!n1||!n0||!x0) return [NaN,NaN,NaN];
  const r=(x1/n1)/(x0/n0); let a=x1,b=x0,m1=n1,m0=n0;
  if(x1===0){a=.5;b=x0+.5;m1=n1+1;m0=n0+1;}   // corrección de Haldane-Anscombe, como en metricas.py
  const se=Math.sqrt(Math.max(0,1/a-1/m1+1/b-1/m0)), rr=(a/m1)/(b/m0);
  return [r, r===0?0:Math.exp(Math.log(rr)-Z*se), Math.exp(Math.log(rr)+Z*se)];
}
const senal=(r,hi,n,u,nMin)=> isNaN(r)?"nodata": r>=u?"sin": (hi<1&&n>=nMin)?"clara":"confirmar";
// Vistas por etapa (cada una sobre quienes superaron la anterior) y vistas acumuladas; igual que VISTAS en metricas.py
const VISTAS = {acceso_cuenta:["acceso","intentos","alta"], llega_modelo:["evaluados","acceso","datos"], aprobacion:["aprobados","evaluados","decision"],
                evaluabilidad:["evaluados","intentos",null], acceso_efectivo:["aprobados","intentos",null]};
class ErrorDatos extends Error{ constructor(k,...a){ super(k); this.k=k; this.a=a; } }

function calcular(altasIn, cred, umbral, nMin, erroresCsv=0){
  if(!altasIn.length) throw new ErrorDatos("e_vacio");
  const altas=altasIn.map(r=>({...r, perfil_entrada: r.perfil_entrada ?? ({estandar:"estandar",no_estandar:"otro"}[r.categoria_documental] ?? r.categoria_documental)}));
  for(const c of ["id_intento","canal","resultado"]) if(!(c in altas[0])) throw new ErrorDatos("e_col",c,"a");
  if(isNull(altas[0].perfil_entrada)) throw new ErrorDatos("e_col","perfil_entrada","a");
  const conCred = !!(cred && cred.length);
  if(conCred) for(const c of ["id_intento","aprobado"]) if(!(c in cred[0])) throw new ErrorDatos("e_col",c,"c");
  const completo = "causa_no_acceso" in altas[0];
  const avisos=[];
  if(erroresCsv) avisos.push(["a_csv",erroresCsv]);
  const idsA=altas.map(r=>String(r.id_intento)), idSet=new Set(idsA), dup=idsA.length-idSet.size; if(dup) avisos.push(["a_dup",dup]);
  const resMal=[...new Set(altas.map(r=>r.resultado))].filter(v=>!RESULTADOS.includes(v)); if(resMal.length) avisos.push(["a_res",resMal.join(", ")]);
  const canMal=[...new Set(altas.map(r=>r.canal))].filter(v=>!CANALES.includes(v)); if(canMal.length) avisos.push(["a_can",canMal.join(", ")]);
  if("fecha" in altas[0]){const m=altas.filter(r=>!isNull(r.fecha)&&!/^\d{4}-\d{2}-\d{2}$/.test(String(r.fecha).trim())).length; if(m) avisos.push(["a_fecha",m]);}
  if(completo){const inc=altas.filter(r=>r.resultado!=="no_acceso"&&!isNull(r.causa_no_acceso)).length; if(inc) avisos.push(["a_incoh",inc]);
    const cm=[...new Set(altas.map(r=>r.causa_no_acceso).filter(v=>!isNull(v)&&!CAUSAS.includes(v)))]; if(cm.length) avisos.push(["a_causa",cm.join(", ")]);}
  // una cuenta es condición para ser evaluado: sólo cuentan las decisiones de intentos con acceso
  const conCuenta=new Set(altas.filter(r=>ACC.includes(r.resultado)).map(r=>String(r.id_intento)));
  const ev=new Set(), ap=new Set();
  if(conCred){
    const vistos={}; for(const r of cred){const i=String(r.id_intento); (vistos[i]=vistos[i]||[]).push(String(r.aprobado).trim().toLowerCase());}
    const rep=Object.values(vistos).filter(v=>v.length>1), contra=rep.filter(v=>new Set(v).size>1).length; if(rep.length) avisos.push(["a_rep",rep.length,contra]);
    const sinCta=Object.keys(vistos).filter(i=>idSet.has(i)&&!conCuenta.has(i)).length; if(sinCta) avisos.push(["a_sincta",sinCta]);
    const nb=cred.filter(r=>!["true","false","1","0","sí","si","no","yes","verdadero","falso"].includes(String(r.aprobado).trim().toLowerCase())).length; if(nb) avisos.push(["a_bool",nb]);
    for(const r of cred){const i=String(r.id_intento); if(conCuenta.has(i)){ev.add(i); if(bool(r.aprobado)) ap.add(i);}}
  }
  const presentes=new Set(altas.map(r=>r.perfil_entrada));
  const perfiles=[...Object.keys(PERFILES.es).filter(p=>presentes.has(p)), ...[...presentes].filter(p=>!(p in PERFILES.es)).sort()];
  if(!presentes.has(REF)) avisos.push(["a_noref"]);
  const desc=[...presentes].filter(p=>!(p in PERFILES.es)&&!(p in EXTRA.es)); if(desc.length) avisos.push(["a_desc",desc.join(", ")]);
  if(conCred){const ids=new Set(altas.map(r=>String(r.id_intento))); const h=[...ev].filter(i=>!ids.has(i)).length; if(h) avisos.push(["a_huerf",h]);}
  const canales=[...CANALES.filter(c=>altas.some(r=>r.canal===c)), ...[...new Set(altas.map(r=>r.canal))].filter(c=>!CANALES.includes(c))];
  const emb={}, traz={}, causas={}, canal={};
  for(const p of perfiles){
    const a=altas.filter(r=>r.perfil_entrada===p), n=a.length;
    if(n<nMin) avisos.push(["a_peq",p,n]);
    const acc=a.filter(r=>ACC.includes(r.resultado)).length, e=a.filter(r=>ev.has(String(r.id_intento))).length, apr=a.filter(r=>ap.has(String(r.id_intento))).length;
    emb[p]={intentos:n,acceso:acc,evaluados:e,aprobados:apr};
    const na=a.filter(r=>r.resultado==="no_acceso"), rev=a.filter(r=>bool(r.revision_humana));
    const sinC=completo?na.filter(r=>isNull(r.causa_no_acceso)).length:0; if(sinC) avisos.push(["a_sinc",sinC,p]);
    const has=c=>c in (a[0]||{});
    const fal=a.filter(r=>r.resultado==="no_acceso"||r.resultado==="alternativa_aceptada");
    traz[p]={noAcceso:na.length, recup:fal.length?fal.filter(r=>r.resultado==="alternativa_aceptada").length/fal.length:NaN, escrita:has("negativa_escrita")&&na.length?na.filter(r=>bool(r.negativa_escrita)).length/na.length:NaN,
      alternativa:has("alternativa_ofrecida")&&na.length?na.filter(r=>bool(r.alternativa_ofrecida)).length/na.length:NaN,
      reversion:rev.length?rev.filter(r=>bool(r.revertida_tras_revision)).length/rev.length:NaN};
    if(completo){const nc=na.filter(r=>!isNull(r.causa_no_acceso)); causas[p]={}; for(const c of CAUSAS) causas[p][c]=nc.length?nc.filter(r=>r.causa_no_acceso===c).length/nc.length:0;}
    canal[p]={}; for(const ch of canales){const x=a.filter(r=>r.canal===ch); canal[p][ch]=x.length?x.filter(r=>ACC.includes(r.resultado)).length/x.length:NaN;}
  }
  const vistas = conCred?Object.keys(VISTAS):["acceso_cuenta"], coc={}, diag={};
  if(presentes.has(REF)) for(const p of perfiles){ if(p===REF) continue; coc[p]={};
    for(const v of vistas){const [num,den]=VISTAS[v], [r,lo,hi]=cocienteIC(emb[p][num],emb[p][den],emb[REF][num],emb[REF][den]); coc[p][v]={r,lo,hi,n:emb[p][den],s:senal(r,hi,emb[p][den],umbral,nMin)};}
    // etapas con señal, en el orden del proceso
    diag[p]=vistas.filter(v=>VISTAS[v][2]&&["clara","confirmar"].includes(coc[p][v].s)).map(v=>VISTAS[v][2]);
  }
  return {perfiles,emb,coc,diag,vistas,traz,causas,canal,canales,avisos,conCred,completo,umbral,nMin};
}

function heatColor(v){
  const stops=[[0,[238,244,252]],[.5,[156,194,238]],[.8,[42,120,214]],[1,[10,34,64]]];
  for(let i=1;i<stops.length;i++){const [p1,c1]=stops[i-1],[p2,c2]=stops[i]; if(v<=p2){const q=(v-p1)/(p2-p1); return c1.map((c,k)=>Math.round(c+(c2[k]-c)*q));}}
  return stops[stops.length-1][1];
}

function wilsonJS(x,n){ if(!n) return [NaN,NaN]; const z=1.959964, p=x/n, d=1+z*z/n, c=(p+z*z/(2*n))/d, h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d; return [Math.max(0,c-h), Math.min(1,c+h)]; }
function calcRep(rows,u,nMin){ if(!rows||!rows.length) return null;

    if(!(n>0)||!(pi>0)) return {g:r.grupo,p:NaN,pi,r:NaN,lo:NaN,hi:NaN,n,s:"nodata"};
    const [lo,hi]=wilsonJS(x,n), rr=(x/n)/pi; return {g:r.grupo,p:x/n,pi,r:rr,lo:lo/pi,hi:hi/pi,n,s:senal(rr,hi/pi,n,u,nMin)}; }); }

function abrirRecurso(k, desplazar=true){
  const r=RECURSOS[k](); ACTUAL=r; ACTUAL_K=k;
  $("vTitle").textContent=r.titulo+" · "+r.archivo+(r.extra?" + "+r.extra.archivo:"");
  $("vBody").innerHTML = (r.cita?`<p class="cite">${r.cita}</p>`:"") + (r.html ? r.html : `<pre>${esc(r.tipo==="text/csv"? r.texto.split("\n").slice(0,201).join("\n") : r.texto)}</pre>`);
  $("vMsg").textContent=""; $("viewer").hidden=false; if(desplazar) $("viewer").scrollIntoView({behavior:"smooth",block:"nearest"});
}
document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>abrirRecurso(b.dataset.rec));
$("vDown").onclick=()=>{ if(!ACTUAL) return; descargar(ACTUAL.archivo,ACTUAL.texto,ACTUAL.tipo); if(ACTUAL.extra) setTimeout(()=>descargar(ACTUAL.extra.archivo,ACTUAL.extra.texto,"text/csv"),500); };
$("vCopy").onclick=async()=>{ if(!ACTUAL) return;
  try{await navigator.clipboard.writeText(ACTUAL.texto); $("vMsg").textContent=t("c_ok");}
  catch(e){const x=document.createElement("textarea"); x.value=ACTUAL.texto; document.body.appendChild(x); x.select();
    try{document.execCommand("copy"); $("vMsg").textContent=t("c_ok");}catch(_){ $("vMsg").textContent=t("c_no");} x.remove();}
};
document.querySelectorAll(".ccopy").forEach(b=>b.onclick=async()=>{ const el=$(b.dataset.copy), txt=el.innerText+" "+(el.parentElement.querySelector(".cav a")||{}).textContent;
  try{await navigator.clipboard.writeText(txt.trim()); b.textContent=t("c_ok");}catch(e){b.textContent=t("c_no");} setTimeout(()=>b.textContent=t("b_copy"),1800); });
$("vClose").onclick=()=>{$("viewer").hidden=true;};
document.querySelectorAll("[data-ir]").forEach(a=>a.onclick=ev=>{ev.preventDefault(); const x=$(a.dataset.ir); if(x){ if(x.tagName==="DETAILS") x.open=true; x.scrollIntoView({behavior:"smooth"});}});
let PLEG=[]; window.addEventListener("beforeprint",()=>{PLEG=[...document.querySelectorAll("#report details:not([open])")]; PLEG.forEach(d=>d.open=true);}); window.addEventListener("afterprint",()=>PLEG.forEach(d=>d.open=false));
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>aplicarIdioma(b.dataset.lang));

// idioma inicial: español; inglés con ?lang=en
(function(){ let ini=null;
  try{ ini=new URLSearchParams(location.search).get("lang"); }catch(e){}
  if(ini!=="en") ini="es";   // español por defecto; inglés sólo con ?lang=en
  aplicarIdioma(ini);
  recalcular(false);         // el informe de ejemplo se muestra desplegado al abrir la página
})();
</script>
</body>
</html>
