const dec = s => L==="es" ? s.replace(".", ",") : s;
const f2 = v => (v==null||isNaN(v)) ? "—" : dec(v.toFixed(2));
const pct = (v,d=0) => (v==null||isNaN(v)) ? "—" : dec((v*100).toFixed(d)) + (L==="es"?" %":"%");
const miles = n => n.toLocaleString(t("num"));
const bool = v => v===true || ["true","1","sí","si","yes","verdadero"].includes(String(v).trim().toLowerCase());
const isNull = v => v==null || String(v).trim()==="" || ["nan","none","null"].includes(String(v).trim().toLowerCase());

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function elegir(u, pares){let s=0; for(const [k,p] of pares){s+=p; if(u<s) return k;} return pares[pares.length-1][0];}
function generarDemo(n=40000, semilla=2026){
  const rnd=mulberry32(semilla), pesos=Object.entries(PARAM).map(([k,v])=>[k,v[0]]), altas=[], cred=[];
  for(let i=0;i<n;i++){
    const u=Array.from({length:13},()=>rnd()), perfil=elegir(u[0],pesos);
    const [,pDig,accD,accO,cauD,cauO,pAlt,pRev,pEsc,pEv,pAp]=PARAM[perfil];
    const digital=u[1]<pDig, canal=digital?(u[2]<.5?"app":"web"):"oficina", ok=u[3]<(digital?accD:accO);
    let causa=null, alt=false, rev=false, revert=false, escrita=null, resultado, dias;
    if(ok){resultado="alta_completada"; dias=Math.floor(u[10]*3);}
    else{causa=elegir(u[4],digital?cauD:cauO); alt=u[5]<pAlt; resultado=(alt&&u[6]<.5)?"alternativa_aceptada":"no_acceso";
      if(resultado==="alternativa_aceptada") causa=null; rev=u[7]<.30; revert=rev&&u[8]<pRev;
      escrita=resultado==="no_acceso"?u[9]<pEsc:null; dias=Math.floor(u[10]*20);}
    const id="I"+String(i).padStart(6,"0");
    altas.push({id_intento:id,fecha:"2026-03-01",canal,producto:"cuenta_ordinaria",perfil_entrada:perfil,resultado,causa_no_acceso:causa,
      alternativa_ofrecida:alt,revision_humana:rev,revertida_tras_revision:revert,negativa_escrita:escrita,dias_resolucion:dias});
    if(resultado!=="no_acceso" && u[11]<pEv) cred.push({id_intento:id,aprobado:u[12]<pAp});
  }
  return {altas,cred};
}

// ---------- estadística (equivalente a evaluabilidad/metricas.py); resultados sin texto, el idioma se aplica al representar
function cocienteIC(x1,n1,x0,n0){
  if(!n1||!n0||!x0) return [NaN,NaN,NaN];
  const r=(x1/n1)/(x0/n0); let a=x1,b=x0,m1=n1,m0=n0;
  if(x1===0){a=.5;b=x0+.5;m1=n1+1;m0=n0+1;}   // corrección de Haldane-Anscombe, como en metricas.py
  const se=Math.sqrt(Math.max(0,1/a-1/m1+1/b-1/m0)), rr=(a/m1)/(b/m0);
  return [r, r===0?0:Math.exp(Math.log(rr)-Z*se), Math.exp(Math.log(rr)+Z*se)];
}
const senal=(r,hi,n,u,nMin)=> isNaN(r)?"nodata": r>=u?"sin": (hi<1&&n>=nMin)?"clara":"confirmar";
// Vistas por etapa (cada una sobre quienes superaron la anterior) y vistas acumuladas; igual que VISTAS en metricas.py
const VISTAS = {acceso_cuenta:["acceso","intentos","alta"], llega_modelo:["evaluados","acceso","datos"], aprobacion:["aprobados","evaluados","decision"],
                evaluabilidad:["evaluados","intentos",null], acceso_efectivo:["aprobados","intentos",null]};
class ErrorDatos extends Error{ constructor(k,...a){ super(k); this.k=k; this.a=a; } }

function calcular(altasIn, cred, umbral, nMin, erroresCsv=0){
  if(!altasIn.length) throw new ErrorDatos("e_vacio");
  const altas=altasIn.map(r=>({...r, perfil_entrada: r.perfil_entrada ?? ({estandar:"estandar",no_estandar:"otro"}[r.categoria_documental] ?? r.categoria_documental)}));
  for(const c of ["id_intento","canal","resultado"]) if(!(c in altas[0])) throw new ErrorDatos("e_col",c,"a");
  if(isNull(altas[0].perfil_entrada)) throw new ErrorDatos("e_col","perfil_entrada","a");
  const conCred = !!(cred && cred.length);
  if(conCred) for(const c of ["id_intento","aprobado"]) if(!(c in cred[0])) throw new ErrorDatos("e_col",c,"c");
  const completo = "causa_no_acceso" in altas[0];
  const avisos=[];
  if(erroresCsv) avisos.push(["a_csv",erroresCsv]);
  const idsA=altas.map(r=>String(r.id_intento)), idSet=new Set(idsA), dup=idsA.length-idSet.size; if(dup) avisos.push(["a_dup",dup]);
  const resMal=[...new Set(altas.map(r=>r.resultado))].filter(v=>!RESULTADOS.includes(v)); if(resMal.length) avisos.push(["a_res",resMal.join(", ")]);
  const canMal=[...new Set(altas.map(r=>r.canal))].filter(v=>!CANALES.includes(v)); if(canMal.length) avisos.push(["a_can",canMal.join(", ")]);
  if("fecha" in altas[0]){const m=altas.filter(r=>!isNull(r.fecha)&&!/^\d{4}-\d{2}-\d{2}$/.test(String(r.fecha).trim())).length; if(m) avisos.push(["a_fecha",m]);}
  if(completo){const inc=altas.filter(r=>r.resultado!=="no_acceso"&&!isNull(r.causa_no_acceso)).length; if(inc) avisos.push(["a_incoh",inc]);
    const cm=[...new Set(altas.map(r=>r.causa_no_acceso).filter(v=>!isNull(v)&&!CAUSAS.includes(v)))]; if(cm.length) avisos.push(["a_causa",cm.join(", ")]);}
  // una cuenta es condición para ser evaluado: sólo cuentan las decisiones de intentos con acceso
  const conCuenta=new Set(altas.filter(r=>ACC.includes(r.resultado)).map(r=>String(r.id_intento)));
  const ev=new Set(), ap=new Set();
  if(conCred){
    const vistos={}; for(const r of cred){const i=String(r.id_intento); (vistos[i]=vistos[i]||[]).push(String(r.aprobado).trim().toLowerCase());}
    const rep=Object.values(vistos).filter(v=>v.length>1), contra=rep.filter(v=>new Set(v).size>1).length; if(rep.length) avisos.push(["a_rep",rep.length,contra]);
    const sinCta=Object.keys(vistos).filter(i=>idSet.has(i)&&!conCuenta.has(i)).length; if(sinCta) avisos.push(["a_sincta",sinCta]);
    const nb=cred.filter(r=>!["true","false","1","0","sí","si","no","yes","verdadero","falso"].includes(String(r.aprobado).trim().toLowerCase())).length; if(nb) avisos.push(["a_bool",nb]);
    for(const r of cred){const i=String(r.id_intento); if(conCuenta.has(i)){ev.add(i); if(bool(r.aprobado)) ap.add(i);}}
  }
  const presentes=new Set(altas.map(r=>r.perfil_entrada));
  const perfiles=[...Object.keys(PERFILES.es).filter(p=>presentes.has(p)), ...[...presentes].filter(p=>!(p in PERFILES.es)).sort()];
  if(!presentes.has(REF)) avisos.push(["a_noref"]);
  const desc=[...presentes].filter(p=>!(p in PERFILES.es)); if(desc.length) avisos.push(["a_desc",desc.join(", ")]);
  if(conCred){const ids=new Set(altas.map(r=>String(r.id_intento))); const h=[...ev].filter(i=>!ids.has(i)).length; if(h) avisos.push(["a_huerf",h]);}
  const canales=[...CANALES.filter(c=>altas.some(r=>r.canal===c)), ...[...new Set(altas.map(r=>r.canal))].filter(c=>!CANALES.includes(c))];
  const emb={}, traz={}, causas={}, canal={};
  for(const p of perfiles){
    const a=altas.filter(r=>r.perfil_entrada===p), n=a.length;
    if(n<nMin) avisos.push(["a_peq",p,n]);
    const acc=a.filter(r=>ACC.includes(r.resultado)).length, e=a.filter(r=>ev.has(String(r.id_intento))).length, apr=a.filter(r=>ap.has(String(r.id_intento))).length;
    emb[p]={intentos:n,acceso:acc,evaluados:e,aprobados:apr};
    const na=a.filter(r=>r.resultado==="no_acceso"), rev=a.filter(r=>bool(r.revision_humana));
    const sinC=completo?na.filter(r=>isNull(r.causa_no_acceso)).length:0; if(sinC) avisos.push(["a_sinc",sinC,p]);
    const has=c=>c in (a[0]||{});
    traz[p]={noAcceso:na.length, escrita:has("negativa_escrita")&&na.length?na.filter(r=>bool(r.negativa_escrita)).length/na.length:NaN,
      alternativa:has("alternativa_ofrecida")&&na.length?na.filter(r=>bool(r.alternativa_ofrecida)).length/na.length:NaN,
      reversion:rev.length?rev.filter(r=>bool(r.revertida_tras_revision)).length/rev.length:NaN};
    if(completo){const nc=na.filter(r=>!isNull(r.causa_no_acceso)); causas[p]={}; for(const c of CAUSAS) causas[p][c]=nc.length?nc.filter(r=>r.causa_no_acceso===c).length/nc.length:0;}
    canal[p]={}; for(const ch of canales){const x=a.filter(r=>r.canal===ch); canal[p][ch]=x.length?x.filter(r=>ACC.includes(r.resultado)).length/x.length:NaN;}
  }
  const vistas = conCred?Object.keys(VISTAS):["acceso_cuenta"], coc={}, diag={};
  if(presentes.has(REF)) for(const p of perfiles){ if(p===REF) continue; coc[p]={};
    for(const v of vistas){const [num,den]=VISTAS[v], [r,lo,hi]=cocienteIC(emb[p][num],emb[p][den],emb[REF][num],emb[REF][den]); coc[p][v]={r,lo,hi,n:emb[p][den],s:senal(r,hi,emb[p][den],umbral,nMin)};}
    // etapas con señal, en el orden del proceso
    diag[p]=vistas.filter(v=>VISTAS[v][2]&&["clara","confirmar"].includes(coc[p][v].s)).map(v=>VISTAS[v][2]);
  }
  return {perfiles,emb,coc,diag,vistas,traz,causas,canal,canales,avisos,conCred,completo,umbral,nMin};
}

// ---------- representación
const dondeTxt = partes => partes.length ? partes.map(k=>t("donde")[k]).join(" · ") : t("donde").sin;
function mini(c, u){
  const W=150,H=22,x=v=>8+(Math.min(1.4,Math.max(.2,v))-.2)/1.2*(W-16), col=SIGCOL[c.s];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${f2(c.r)}"><title>${t("tip")(f2(c.r),f2(c.lo),f2(c.hi),t("sig")[c.s])}</title>
  <line x1="8" x2="${W-8}" y1="${H/2}" y2="${H/2}" stroke="#eaecf0" stroke-width="6" stroke-linecap="round"/>
  <line x1="${x(1)}" x2="${x(1)}" y1="3" y2="${H-3}" stroke="#d0d5dd"/>
  <line x1="${x(u)}" x2="${x(u)}" y1="2" y2="${H-2}" stroke="#475467" stroke-dasharray="2 2"/>
  <line x1="${x(c.lo)}" x2="${x(c.hi)}" y1="${H/2}" y2="${H/2}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>
  <circle cx="${x(c.r)}" cy="${H/2}" r="5" fill="${col}" stroke="#fff" stroke-width="2"/></svg>`;
}
const chip = s => `<span class="chip" style="color:${SIGCOL[s]}"><i style="background:${SIGCOL[s]}"></i>${t("sig")[s]}</span>`;
function heatColor(v){
  const stops=[[0,[238,244,252]],[.5,[156,194,238]],[.8,[42,120,214]],[1,[10,34,64]]];
  for(let i=1;i<stops.length;i++){const [p1,c1]=stops[i-1],[p2,c2]=stops[i]; if(v<=p2){const q=(v-p1)/(p2-p1); return c1.map((c,k)=>Math.round(c+(c2[k]-c)*q));}}
  return stops[stops.length-1][1];
}
const heatCell = (v,title="") => { if(isNaN(v)) return `<td class="h">—</td>`; const [r,g,b]=heatColor(v);
  return `<td class="h" style="background:rgb(${r},${g},${b});color:${v>.75?"#fff":"#101828"}"${title?` title="${esc(title)}"`:""}>${v>0?pct(v):"·"}</td>`; };

let ULTIMO_R=null, ULTIMO_LABEL=null;
function render(R, label, desplazar=true){
  ULTIMO_R=R; ULTIMO_LABEL=label;
  const {perfiles,emb,coc,diag,vistas,traz,causas,canal,canales,avisos,conCred,completo,umbral,nMin}=R;
  const lab = typeof label==="function" ? label() : label;
  $("srcLabel").innerHTML = `<b>${t("fuente")}</b> ${esc(lab)} <span class="pill">${completo?t("modo_c"):t("modo_b")}</span><span class="pill">${conCred?t("con_c"):t("sin_c")}</span><span class="pill">${t("umbral")} ${f2(umbral)}</span>`;
  const vf = conCred?"acceso_efectivo":"acceso_cuenta", verbo = conCred?t("verbo_c"):t("verbo_b");
  let cc = Object.keys(diag).filter(p=>diag[p].length).map(p=>{
    const c=coc[p][vf], e=coc[p].aprobacion, k=diag[p][0]; let extra="";
    if(k==="alta" && e && e.s==="sin") extra=t("extra_alta"); else if(k==="datos") extra=t("extra_datos"); else if(k==="decision") extra=t("extra_decision");
    const d = t("donde")[k].toLowerCase();
    return `<div class="concl">${t("concl")(esc(nom(p)),verbo,Math.round(c.r*100),Math.round(c.lo*100),Math.round(c.hi*100),esc(d),extra)}</div>`;});
  if(!Object.keys(diag).length) cc=[`<div class="concl">${t("no_ref")}</div>`];
  else if(!cc.length) cc=[`<div class="concl ok">${t("ok_all")(f2(umbral))}</div>`];
  $("concl").innerHTML = cc.join("");
  const vs=["acceso_cuenta","llega_modelo","aprobacion"].filter(v=>vistas.includes(v));
  $("tCoc").innerHTML = `<table class="ctab"><tr><th>${t("th_perfil")}</th>${vs.map(v=>`<th style="text-align:left">${t("vistas")[v]}</th>`).join("")}<th style="text-align:left">${t("th_donde")}</th></tr>`+
    Object.keys(coc).map(p=>`<tr><td><b>${esc(nom(p))}</b><br><span class="small muted">${miles(emb[p].intentos)} ${t("intentos")}</span></td>${vs.map(v=>{const c=coc[p][v];
      return `<td class="cell" style="text-align:left">${mini(c,umbral)}<br><span class="v">${f2(c.r)}</span><span class="ci">[${f2(c.lo)}–${f2(c.hi)}]</span> ${chip(c.s)}</td>`;}).join("")}
      <td style="text-align:left;white-space:normal"><span class="where">${esc(dondeTxt(diag[p]))}</span></td></tr>`).join("")+`</table>`;
  $("legSig").innerHTML = ["clara","confirmar","sin"].map(chip).join("") + `<span class="small muted">${t("leg")(nMin)}</span>`;
  $("tCanal").innerHTML = `<table class="heat"><tr><th>${t("th_perfil")}</th>${canales.map(c=>`<th style="text-align:center">${t("canales")[c]||esc(c)}</th>`).join("")}</tr>`+
    perfiles.map(p=>`<tr><td>${esc(nom(p))}</td>${canales.map(c=>heatCell(canal[p][c], `${nom(p)} · ${t("canales")[c]||c}: ${pct(canal[p][c],1)}`)).join("")}</tr>`).join("")+`</table>`;
  const bar=v=>isNaN(v)?"—":`<span class="bar-in" style="width:${Math.round(v*60)}px"></span>${pct(v)}`;
  $("tEmb").innerHTML = `<table><tr><th>${t("th_perfil")}</th><th>${t("th_cuenta")}</th>${conCred?`<th>${t("th_llega")}</th><th>${t("th_credito")}</th><th>${t("th_llega_c")}</th><th>${t("th_apr_e")}</th>`:""}</tr>`+
    perfiles.map(p=>{const e=emb[p]; return `<tr><td>${esc(nom(p))}</td><td>${bar(e.acceso/e.intentos)}</td>${conCred?`<td>${bar(e.evaluados/e.intentos)}</td><td>${bar(e.aprobados/e.intentos)}</td><td class="small">${pct(e.acceso?e.evaluados/e.acceso:NaN)}</td><td class="small">${pct(e.evaluados?e.aprobados/e.evaluados:NaN)}</td>`:""}</tr>`;}).join("")+`</table>`;
  $("tTraz").innerHTML = `<table><tr><th>${t("th_perfil")}</th><th>${t("th_sin")}</th><th>${t("th_escrita")}</th><th>${t("th_alt")}</th><th>${t("th_rev")}</th></tr>`+
    perfiles.map(p=>{const x=traz[p]; return `<tr><td>${esc(nom(p))}</td><td>${miles(x.noAcceso)}</td><td>${pct(x.escrita)}</td><td>${pct(x.alternativa)}</td><td>${pct(x.reversion)}</td></tr>`;}).join("")+`</table>`;
  if(completo){const cs=CAUSAS.filter(c=>perfiles.some(p=>causas[p]&&causas[p][c]>0));
    $("tCausas").innerHTML = `<table class="heat"><tr><th>${t("th_perfil")}</th>${cs.map(c=>`<th style="text-align:center;white-space:normal">${t("causas")[c]}</th>`).join("")}</tr>`+
      perfiles.map(p=>`<tr><td>${esc(nom(p))}</td>${cs.map(c=>heatCell(causas[p][c])).join("")}</tr>`).join("")+`</table>`;}
  else $("tCausas").innerHTML = `<p class="small muted">${t("basico")}</p>`;
  $("avisos").textContent = avisos.length ? t("calidad")+" "+avisos.map(([k,...a])=>{ if(k==="a_peq") a[0]=nom(a[0]); if(k==="a_sinc") a[1]=nom(a[1]); const f=t(k); return typeof f==="function"?f(...a):f; }).join(" ") : t("calidad_ok");
  $("report").style.display="block"; if(desplazar) $("report").scrollIntoView({behavior:"smooth"});
}

// ---------- idioma

  L = lang==="en" ? "en" : "es";
  document.documentElement.lang = L; document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v=t(el.dataset.i18n); if(typeof v==="string") el.innerHTML=v; });

// ---------- acciones
const msg=(txt,err)=>{$("msg").textContent=txt; $("msg").className="msg"+(err?" err":"");};
const msgErr=e=>{ if(e instanceof ErrorDatos){ const f=t(e.k); msg(typeof f==="function"?f(...e.a):f,true);} else msg(e.message,true); };
const umbral=()=>{const v=parseFloat(String($("umbral").value).replace(",", ".")); return (v>0&&v<=1)?v:0.8;};
const nMin=()=>{const v=parseInt($("nmin").value,10); return v>0?v:100;};
let DEMO=null; const demo=()=>DEMO||(DEMO=generarDemo());
let FUENTE=null; // {a,c,label}
function recalcular(desplazar=true){ try{ const R = FUENTE ? calcular(FUENTE.a,FUENTE.c,umbral(),nMin(),FUENTE.err) : (()=>{const d=demo(); return calcular(d.altas,d.cred,umbral(),nMin());})();
  render(R, FUENTE ? FUENTE.label : ()=>t("demo_label"), desplazar); msg(""); } catch(e){ msgErr(e); } }
$("bDemo").onclick=()=>{ FUENTE=null; recalcular(); };
$("bLoad").onclick=()=>$("upload").classList.toggle("show");
$("bPrint").onclick=()=>{ if($("report").style.display==="none") $("bDemo").click(); setTimeout(()=>window.print(),400); };
const parse=f=>new Promise((res,rej)=>Papa.parse(f,{header:true,skipEmptyLines:true,dynamicTyping:false,complete:r=>{r.data.err=r.errors.length; res(r.data);},error:rej}));
$("bRun").onclick=async()=>{
  const fa=$("fAltas").files[0], fc=$("fCred").files[0];
  if(!fa){msg(t("e_sel"),true);return;}
  try{ const a=await parse(fa), c=fc?await parse(fc):null; FUENTE={a,c,err:a.err+(c?c.err:0),label:()=>t("tus")(fa.name, fc&&fc.name)}; recalcular(); }
  catch(e){ msgErr(e); }
};
$("umbral").onchange=$("nmin").onchange=()=>{ if($("report").style.display!=="none") recalcular(false); };

  tplc:  ()=>({titulo:t("r_tplc"), archivo:"plantilla_decisiones_credito.csv", tipo:"text/csv", texto:"id_intento,aprobado\nI000001,true\nI000003,false\n"}),
  schema:()=>({titulo:t("r_schema"), archivo:"registro_no_acceso.schema.json", tipo:"application/json", texto:JSON.stringify(SCHEMA,null,2)}),
  form:  ()=>{const d=DOCS[L].form||DOCS.es.form; return {titulo:d.titulo, archivo:d.archivo, tipo:"text/markdown", texto:d.md, html:d.html};},
  check: ()=>{const d=DOCS[L].check||DOCS.es.check; return {titulo:d.titulo, archivo:d.archivo, tipo:"text/markdown", texto:d.md, html:d.html};},
  demo:  ()=>{const d=demo(), e=v=>v==null?"":v; return {titulo:t("r_demo"), archivo:"altas_demo.csv", tipo:"text/csv",
            texto:COLS.join(",")+"\n"+d.altas.map(r=>COLS.map(c=>e(r[c])).join(",")).join("\n"), extra:{archivo:"credito_demo.csv", texto:"id_intento,aprobado\n"+d.cred.map(r=>r.id_intento+","+r.aprobado).join("\n")}};}
};
let ACTUAL=null, ACTUAL_K=null;
function descargar(nombre,texto,tipo){
  try{const b=new Blob([texto],{type:tipo+";charset=utf-8"}), a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    $("vMsg").textContent=t("d_ini")(nombre);}
  catch(e){$("vMsg").textContent=t("d_no");}
}
function abrirRecurso(k, desplazar=true){
  const r=RECURSOS[k](); ACTUAL=r; ACTUAL_K=k;
  $("vTitle").textContent=r.titulo+" · "+r.archivo+(r.extra?" + "+r.extra.archivo:"");
  $("vBody").innerHTML = r.html ? r.html : `<pre>${esc(r.tipo==="text/csv"? r.texto.split("\n").slice(0,201).join("\n") : r.texto)}</pre>`;
  $("vMsg").textContent=""; $("viewer").hidden=false; if(desplazar) $("viewer").scrollIntoView({behavior:"smooth",block:"nearest"});
}
document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>abrirRecurso(b.dataset.rec));
$("vDown").onclick=()=>{ if(!ACTUAL) return; descargar(ACTUAL.archivo,ACTUAL.texto,ACTUAL.tipo); if(ACTUAL.extra) setTimeout(()=>descargar(ACTUAL.extra.archivo,ACTUAL.extra.texto,"text/csv"),500); };
$("vCopy").onclick=async()=>{ if(!ACTUAL) return;
  try{await navigator.clipboard.writeText(ACTUAL.texto); $("vMsg").textContent=t("c_ok");}
  catch(e){const x=document.createElement("textarea"); x.value=ACTUAL.texto; document.body.appendChild(x); x.select();
    try{document.execCommand("copy"); $("vMsg").textContent=t("c_ok");}catch(_){ $("vMsg").textContent=t("c_no");} x.remove();}
};
$("vClose").onclick=()=>{$("viewer").hidden=true;};
document.querySelectorAll("[data-ir]").forEach(a=>a.onclick=ev=>{ev.preventDefault(); const x=$(a.dataset.ir); if(x) x.scrollIntoView({behavior:"smooth"});});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>aplicarIdioma(b.dataset.lang));

// idioma inicial: ?lang=en|es, luego la preferencia guardada, luego el idioma del navegador
(function(){ let ini=null;
  try{ ini=new URLSearchParams(location.search).get("lang"); }catch(e){}
  if(!ini){ try{ ini=localStorage.getItem("evaluabilidad_idioma"); }catch(e){} }
  if(!ini) ini = (navigator.language||"es").toLowerCase().startsWith("es") ? "es" : "en";
  aplicarIdioma(ini);
})();
</script>
